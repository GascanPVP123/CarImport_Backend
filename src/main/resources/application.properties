# Configuración del Servidor
server.port=10000

# Conexión a PostgreSQL en Render
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuraciones de HikariCP para evitar cierre de conexiones en la nube
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=10000

# Ajuste crítico de Hibernate: Cambiar 'update' por 'create-drop' o 'validate' si ya creaste las tablas, 
# o usar 'update' con validación relajada.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Desactivar validaciones estrictas de esquemas que rompen la conexión en la nube
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

spring.flyway.enabled=false
